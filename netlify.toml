[build]
  command = "./tool/netlify_build.sh"
  publish = "build/web"

[build.environment]
  # Keep this pinned to the SDK the app is developed against.
  FLUTTER_VERSION = "3.44.6"
  FLUTTER_SUPPRESS_ANALYTICS = "true"
  CI = "true"
  # The multiplayer host, compiled into the app. Must be wss:// — a browser
  # refuses a plaintext socket from this https page. Matches the Fly app name
  # in fly.toml; change both together.
  GAME_HOST = "wss://canastra-flutter.fly.dev"
  # Accounts and stats. Optional — a build without these still plays offline and
  # keeps a local streak, it just cannot sign anyone in.
  SUPABASE_URL = "https://urqrmvbenrdehsurvosb.supabase.co"
  # SUPABASE_ANON_KEY is public by design: row-level security decides who may
  # read what, not possession of this key. Rotating it needs a rebuild, because
  # it is compiled into the bundle.
  SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVycXJtdmJlbnJkZWhzdXJ2b3NiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzODgxOTksImV4cCI6MjEwMDk2NDE5OX0.fl4-u81CzaP0xPpDEHVnYRquNMoL10x4ScX0qZsZPIM"

# Flutter web is a single page; let it handle every route itself.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build artefacts never change under the same name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/canvaskit/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The bootstrap script and service worker point at the current build.
[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
