# fly.toml app configuration file generated for canastra-flutter on 2026-07-30T11:54:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'canastra-flutter'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALLOWED_ORIGINS = 'https://canastra.netlify.app'
  GAME_PLAYERS = '2'
  GAME_PROFILE = 'buraco'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
